<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mesh-bg"></div>
    <div class="noise-overlay"></div>

    <!-- MAIN MENU -->
    <main id="homeScreen" class="screen active">
        <div class="hero-container">
            <h1 class="hero-title">The chase<br>begins here.</h1>
            <div class="hero-actions">
                <button id="btnHostMatch" class="btn-primary">
                    <span class="btn-text">HOST PRIVATE MATCH</span>
                </button>
                <div class="join-group">
                    <input type="text" id="joinCodeInput" placeholder="ROOM CODE" autocomplete="off" maxlength="10">
                    <button id="btnJoinMatch" class="btn-secondary">→</button>
                </div>
            </div>
        </div>
    </main>

    <!-- LOBBY BENTO GRID -->
    <main id="lobbyScreen" class="screen">
        <div class="bento-container">
            <div class="bento-header">
                <p class="eyebrow">ROOM CODE</p>
                <h2 id="displayRoomCode" class="room-code-title">----</h2>
            </div>
            
            <div class="bento-grid">
                <!-- Map Cell -->
                <div class="bento-cell map-cell" id="bentoMapCell">
                    <div class="cell-content">
                        <p class="cell-label">ARENA</p>
                        <h3 id="displayMapName" class="cell-title">Classic</h3>
                        <p id="displayMapDesc" class="cell-desc">Open rooftop chase with ramps.</p>
                        
                        <!-- Host Map Selector (Hidden if not host) -->
                        <div id="hostMapSelector" class="host-controls hidden">
                            <button class="arrow-btn" id="btnPrevMap">←</button>
                            <span class="control-label">CHANGE</span>
                            <button class="arrow-btn" id="btnNextMap">→</button>
                        </div>
                    </div>
                    <div class="cell-bg" id="mapBgPreview"></div>
                </div>

                <!-- Players Cell -->
                <div class="bento-cell roster-cell">
                    <div class="cell-content">
                        <p class="cell-label">ROSTER</p>
                        <div id="lobbyPlayerList" class="player-list">
                            <!-- Populated by JS -->
                        </div>
                        
                        <div id="hostSizeSelector" class="host-controls hidden">
                            <button class="arrow-btn" id="btnSizeDown">-</button>
                            <span class="control-label" id="displayMaxPlayers">4 PLAYERS</span>
                            <button class="arrow-btn" id="btnSizeUp">+</button>
                        </div>
                    </div>
                </div>

                <!-- Action Cell -->
                <div class="bento-cell action-cell" id="bentoActionCell">
                    <button id="btnStartGame" class="btn-massive hidden">START GAME</button>
                    <div id="waitingForHostStatus" class="waiting-status">WAITING FOR HOST...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- ERROR TOAST -->
    <div id="errorMessage" class="error-toast hidden"></div>

    <!-- GAME CANVAS -->
    <main id="gameScreen" class="screen">
        <div class="hud-shell">
            <div id="gameInfo">
                <div id="status" class="hud-chip">Role <span id="playerRole"></span></div>
                <div id="timer" class="hud-chip">Clock <span id="timeDisplay">75</span>s</div>
            </div>
            <div id="roundBanner" class="round-banner hidden"></div>
            <canvas id="gameCanvas"></canvas>
            
            <div id="gameOverScreen" class="game-over-screen hidden">
                <div class="game-over-card">
                    <p class="game-over-label">Round Over</p>
                    <h2 id="gameOverTitle">LOSER</h2>
                    <p id="gameOverPlayer" class="game-over-player"></p>
                    <p id="gameOverMessage" class="game-over-message"></p>
                    <button id="playAgainBtn" class="play-again-btn">BACK TO LOBBY</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
